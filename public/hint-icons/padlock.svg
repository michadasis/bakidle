    <path d="M 227 544 L 227 404 A 285 285 0 0 1 797 404 L 797 544 L 637 544 L 637 404 A 125 125 0 0 0 387 404 L 387 544 Z" fill="url(#pdbone)" stroke="#000000" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 286 400 Q 306 276 414 226" stroke="#fbf8f3" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 700 262 Q 762 318 766 424" stroke="#000000" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>
    <rect x="150" y="444" width="724" height="460" rx="78" fill="url(#pdbone)" stroke="#000000" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <g clip-path="url(#pdBody)">
      <rect x="606" y="444" width="300" height="460" fill="url(#pdhatch)" opacity="0.3"/>
      <rect x="648" y="444" width="260" height="460" fill="#000000" opacity="0.1"/>
      <path d="M 150 540 L 874 540" stroke="#000000" stroke-width="12" opacity="0.26"/>
    </g>
    <circle cx="228" cy="512" r="21" fill="#c9bdb0" stroke="#000000" stroke-width="12"/>
    <circle cx="796" cy="512" r="21" fill="#c9bdb0" stroke="#000000" stroke-width="12"/>
    <circle cx="512" cy="632" r="98" fill="#000000" stroke="#000000" stroke-width="20"/>
    <polygon points="444,682 580,682 610,836 414,836" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="512" cy="632" r="68" fill="url(#pdred)"/>
    <polygon points="460,674 564,674 584,812 440,812" fill="url(#pdred)"/>
    <path d="M 214 566 Q 196 624 200 700" stroke="#fbf8f3" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 254 806 L 404 766" stroke="#000000" stroke-width="18" stroke-linecap="round" opacity="0.3"/>
    <path d="M 254 800 L 404 760" stroke="#d0342c" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M 664 856 L 758 836" stroke="#d0342c" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  </g>
</g>
<g id="grit" clip-path="url(#pdLock)" pointer-events="none">
  <rect width="1024" height="1024" filter="url(#pdspecks)" opacity="0.4"/>
  <rect x="-200" y="-200" width="1424" height="1424" filter="url(#pdscratches)" opacity="0.22" transform="rotate(-28 512 512)"/>
</g>
</svg>
